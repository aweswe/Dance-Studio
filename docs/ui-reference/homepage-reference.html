<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blk:#0F0F0F;--deep:#141414;--bl:#2BB4D8;--bll:#B8E4F0;--blp:#E8F7FC;
  --wh:#ffffff;--mu:#777;--light:#F7F9FB;--off:#F2F2F2;
  --green:#1DB954;--gold:#F5A623;--purp:#8B5CF6
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--wh);color:var(--blk);overflow-x:hidden}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;justify-content:space-between;padding:10px 48px;background:rgba(255,255,255,0.97);border-bottom:1px solid rgba(0,0,0,0.07);backdrop-filter:blur(12px)}
.nav-logo img{height:44px;display:block}
.nav-links{display:flex;gap:24px;list-style:none}
.nav-links a{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:rgba(0,0,0,0.45);text-decoration:none;font-weight:500;transition:color .2s}
.nav-links a:hover{color:var(--bl)}
.nav-right{display:flex;gap:10px;align-items:center}
.nav-cta{font-size:11px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;padding:10px 22px;text-decoration:none;display:inline-block;cursor:pointer;border:none;transition:all .2s}
.nav-cta.outline{background:transparent;color:var(--blk);border:1px solid rgba(0,0,0,0.18)}
.nav-cta.outline:hover{border-color:var(--bl);color:var(--bl)}
.nav-cta.fill{background:var(--blk);color:var(--wh)}
.nav-cta.fill:hover{background:var(--bl)}

/* ── HERO ── */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--blk);position:relative;overflow:hidden;padding:110px 24px 80px}
.hero-orb1{position:absolute;top:-120px;left:-120px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(43,180,216,.18) 0%,transparent 70%);pointer-events:none}
.hero-orb2{position:absolute;bottom:-80px;right:-80px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(43,180,216,.1) 0%,transparent 70%);pointer-events:none}
.hero-logo{height:150px;filter:brightness(0) invert(1);position:relative;z-index:1;margin-bottom:24px}
.hero-div{width:1px;height:44px;background:rgba(255,255,255,.12);margin:0 auto 22px;position:relative;z-index:1}
.hero h1{font-family:"Bebas Neue",sans-serif;font-size:clamp(60px,10vw,120px);line-height:.88;letter-spacing:3px;color:var(--wh);position:relative;z-index:1;margin-bottom:8px}
.hero h1 span{color:var(--bl)}
.hero-tag{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:36px;position:relative;z-index:1}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative;z-index:1}
.btn-bl{background:var(--bl);color:var(--wh);font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:14px 36px;text-decoration:none;display:inline-block;border:none;cursor:pointer;transition:opacity .2s}
.btn-bl:hover{opacity:.85}
.btn-out{background:transparent;color:var(--wh);font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;border:1px solid rgba(255,255,255,.2);padding:13px 32px;text-decoration:none;display:inline-block;transition:all .2s}
.btn-out:hover{border-color:var(--bl);color:var(--bl)}
.scroll-hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.15);display:flex;flex-direction:column;align-items:center;gap:6px}
.scroll-line{width:1px;height:28px;background:rgba(255,255,255,.1)}

/* ── MARQUEE ── */
.mq{background:var(--bl);overflow:hidden;padding:12px 0;white-space:nowrap}
.mqi{display:inline-flex;gap:40px;animation:mq 20s linear infinite}
.mqi span{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--wh);font-weight:600}
.mqi .dot{opacity:.35}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--wh);border-bottom:1px solid rgba(0,0,0,.07)}
.stat{text-align:center;padding:32px 20px;border-right:1px solid rgba(0,0,0,.07)}
.stat:last-child{border-right:none}
.stat-n{font-family:"Bebas Neue",sans-serif;font-size:48px;color:var(--bl);line-height:1}
.stat-l{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-top:4px}

/* ── SECTION ── */
.sec{padding:88px 64px}
.sec-dk{background:var(--blk)}
.sec-lt{background:var(--light)}
.sec-off{background:var(--off)}
.lbl{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:var(--bl);margin-bottom:12px}
.sec-dk .lbl{color:var(--bll)}
.ttl{font-family:"Bebas Neue",sans-serif;font-size:clamp(36px,5vw,60px);letter-spacing:2px;line-height:.93;color:var(--blk)}
.ttl-w{color:var(--wh)}
.bdy{font-size:14px;color:var(--mu);line-height:1.78;max-width:520px;margin-top:14px}
.bdy-w{color:rgba(255,255,255,.42)}
.sec-hdr{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:48px;flex-wrap:wrap;gap:20px}

/* ── PROGRAM CARDS ── */
.prog-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:0}
.prog-card{border-radius:16px;overflow:hidden;position:relative}
.prog-card-inner{padding:40px}
.prog-card.fitness{background:linear-gradient(135deg,#0F2236 0%,#1A3C5E 100%);border:1px solid rgba(43,180,216,.25)}
.prog-card.dance{background:linear-gradient(135deg,#0F0F0F 0%,#1A1A1A 100%);border:1px solid rgba(255,255,255,.1)}
.prog-card.kuchipudi{background:linear-gradient(135deg,#1a0a2e 0%,#2d1054 100%);border:1px solid rgba(139,92,246,.3)}
.prog-badge{display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;font-size:9px;letter-spacing:3px;text-transform:uppercase;font-weight:700;padding:5px 12px;border-radius:20px}
.prog-badge.fit-b{background:rgba(43,180,216,.15);color:var(--bl)}
.prog-badge.dance-b{background:rgba(245,166,35,.15);color:var(--gold)}
.prog-badge.kuch-b{background:rgba(139,92,246,.2);color:var(--purp)}
.prog-badge.kids-b{background:rgba(29,185,84,.15);color:var(--green)}
.prog-title{font-family:"Bebas Neue",sans-serif;font-size:34px;letter-spacing:2px;color:var(--wh);margin-bottom:8px;line-height:1}
.prog-sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:20px}
.prog-includes{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:24px}
.prog-includes li{font-size:13px;color:rgba(255,255,255,.65);display:flex;align-items:center;gap:8px}
.prog-includes li::before{content:"✓";color:var(--bl);font-size:11px;font-weight:700;flex-shrink:0}
.prog-includes li.gold::before{color:var(--gold)}
.prog-includes li.purp::before{color:var(--purp)}
.prog-sched{background:rgba(255,255,255,.06);border-radius:8px;padding:12px 16px;margin-bottom:20px}
.prog-sched p{font-size:11px;color:rgba(255,255,255,.5);margin-bottom:4px;letter-spacing:.5px}
.prog-sched strong{font-size:12px;color:rgba(255,255,255,.85);display:block}
.prog-fees{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.fee-chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:10px 16px;text-align:center}
.fee-chip.highlight{background:rgba(43,180,216,.15);border-color:rgba(43,180,216,.4)}
.fee-chip.gold-h{background:rgba(245,166,35,.12);border-color:rgba(245,166,35,.35)}
.fee-chip.purp-h{background:rgba(139,92,246,.15);border-color:rgba(139,92,246,.4)}
.fee-amount{font-family:"Bebas Neue",sans-serif;font-size:28px;color:var(--wh);letter-spacing:1px;line-height:1}
.fee-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.38);margin-top:3px}
.prog-btn{display:block;width:100%;text-align:center;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:13px;border:none;cursor:pointer;transition:all .2s;text-decoration:none}
.prog-btn.bl{background:var(--bl);color:var(--wh)}
.prog-btn.bl:hover{background:#22a0c4}
.prog-btn.gold-btn{background:var(--gold);color:#000}
.prog-btn.purp-btn{background:var(--purp);color:var(--wh)}
.prog-btn:hover{opacity:.9}
.prog-accent{position:absolute;top:-20px;right:-20px;width:120px;height:120px;border-radius:50%;opacity:.08}
.acc-bl{background:var(--bl)}
.acc-gold{background:var(--gold)}
.acc-purp{background:var(--purp)}

/* RECOMMENDED BADGE */
.rec-badge{position:absolute;top:20px;right:20px;background:var(--bl);color:var(--wh);font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:700;padding:5px 12px;border-radius:20px}
.rec-badge.gold-rec{background:var(--gold);color:#000}

/* ── SCHEDULE ── */
.sch-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px}
.sf{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:8px 18px;background:transparent;border:1px solid #DDD;color:#777;cursor:pointer;transition:all .2s;border-radius:4px}
.sf.on,.sf:hover{background:var(--blk);color:var(--wh);border-color:var(--blk)}
.day-block{margin-bottom:32px}
.day-label{font-family:"Bebas Neue",sans-serif;font-size:20px;letter-spacing:3px;color:var(--blk);padding-bottom:10px;border-bottom:2px solid var(--bll);margin-bottom:2px}
</style>
