      <stop offset="0%" stop-color="#141E28" />
      <stop offset="100%" stop-color="#0A0F14" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" rx="12" fill="url(#bgGrad8)" />
  <circle cx="200" cy="250" r="140" fill="#2BB4D8" opacity="0.04" />
  
  <!-- Hoodie Graphic -->
  <g transform="translate(45, 45)">
    <!-- Hood shape -->
    <path d="M100 80 C100 20 210 20 210 80 C210 100 100 100 100 80 Z" fill="#0F172A" stroke="#374151" stroke-width="2" />
    <!-- Drawstrings -->
    <path d="M140 85 L135 150" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M170 85 L175 150" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <!-- Torso & Sleeves -->
    <path d="M100 80 L30 135 L60 310 L95 290 L95 350 L215 350 L215 290 L250 310 L280 135 L210 80 Z" 
          fill="url(#hoodieGrad)" stroke="#374151" stroke-width="2" />
    <!-- Kangaroo Pocket -->
    <path d="M115 240 L195 240 L210 320 L100 320 Z" fill="#0B132B" stroke="#2BB4D8" stroke-width="1.5" />
    <!-- Chest Minimal Print -->
    <text x="155" y="145" text-anchor="middle" font-family="monospace" font-size="9" font-weight="800" fill="#2BB4D8" letter-spacing="4">FEEL THE BEAT</text>
