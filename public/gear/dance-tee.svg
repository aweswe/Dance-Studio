    <!-- Hem details -->
    <line x1="95" y1="315" x2="215" y2="315" stroke="#2BB4D8" stroke-width="2" opacity="0.6" />
    <!-- Chest Brand Logo -->
    <circle cx="155" cy="115" r="14" fill="#2BB4D8" opacity="0.15" />
    <path d="M150 110 L160 110 L158 116 L152 116 L154 121 L162 121" stroke="#2BB4D8" stroke-width="2.5" stroke-linecap="round" fill="none" />
