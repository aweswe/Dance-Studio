      <stop offset="0%" stop-color="#141E28" />
      <stop offset="100%" stop-color="#0A0F14" />
    </linearGradient>
    <linearGradient id="teeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2BB4D8" />
      <stop offset="100%" stop-color="#5EEAD4" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" rx="12" fill="url(#bgGrad)" />
  <circle cx="200" cy="240" r="140" fill="#2BB4D8" opacity="0.04" />
  
  <!-- Studio Grid Accent -->
  <path d="M50 420 L350 420 M100 440 L300 440" stroke="#2BB4D8" stroke-width="1" opacity="0.15" />
  
