<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E28" />
      <stop offset="100%" stop-color="#0A0F14" />
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="70%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" rx="12" fill="url(#bgGrad4)" />
  <circle cx="200" cy="250" r="140" fill="#2BB4D8" opacity="0.04" />
  
  <!-- Jacket Graphic -->
  <g transform="translate(45, 60)">
    <!-- High Collar -->
    <path d="M115 40 L195 40 L190 65 L120 65 Z" fill="#2D3748" stroke="#4A5568" stroke-width="2" />
    <!-- Main Body & Sleeves -->
    <path d="M115 55 L40 100 L65 290 L95 270 L95 330 L215 330 L215 270 L245 290 L270 100 L195 55 Z" 
          fill="url(#jacketGrad)" stroke="#374151" stroke-width="2" />
    <!-- Zipper line down center -->
    <line x1="155" y1="40" x2="155" y2="330" stroke="#2BB4D8" stroke-width="2.5" />
    <!-- Cyan Shoulder Insets -->
    <path d="M115 55 L80 150 L100 150 L125 75 Z" fill="#2BB4D8" opacity="0.8" />
    <path d="M195 55 L230 150 L210 150 L185 75 Z" fill="#2BB4D8" opacity="0.8" />
    <!-- Chest Brand Insignia -->
    <circle cx="130" cy="115" r="10" fill="#2BB4D8" opacity="0.2" />
    <path d="M127 111 L133 111 L132 115 L128 115 L129 119 L135 119" stroke="#2BB4D8" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>
</svg>
