<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E28" />
      <stop offset="100%" stop-color="#0A0F14" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="50%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" rx="12" fill="url(#bgGrad10)" />
  <circle cx="200" cy="250" r="140" fill="#2BB4D8" opacity="0.04" />
  
  <!-- Duffle Bag Graphic -->
  <g transform="translate(60, 110)">
    <!-- Carry Handles -->
    <path d="M90 120 C90 40 190 40 190 120" stroke="#2BB4D8" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Main Cylinder Body -->
    <rect x="30" y="120" width="220" height="110" rx="20" fill="url(#bagGrad)" stroke="#4A5568" stroke-width="2" />
    <!-- Zipper -->
    <line x1="40" y1="135" x2="240" y2="135" stroke="#2BB4D8" stroke-width="2.5" />
    <!-- Left & Right End Caps -->
    <ellipse cx="45" cy="175" rx="14" ry="40" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <ellipse cx="235" cy="175" rx="14" ry="40" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <!-- Logo Badge on Center -->
    <rect x="100" y="160" width="80" height="28" rx="4" fill="#0B132B" stroke="#2BB4D8" stroke-width="1.5" />
    <text x="140" y="178" text-anchor="middle" font-family="monospace" font-size="8" font-weight="800" fill="#2BB4D8" letter-spacing="2">RHYTHMZZ</text>
  </g>
</svg>
